name: Build et déploiement
on:
  push:
    branches: [main]
    paths: ["data/**", "assets/**", "scripts/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Générer les pages produits
        run: python3 scripts/build.py

      - name: Publier les fichiers générés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A produit data/lots sitemap.xml robots.txt index.html
          if git diff --cached --quiet; then
            echo "Rien à mettre à jour."
          else
            git commit -m "build: régénération des pages produits"
            git push
          fi
